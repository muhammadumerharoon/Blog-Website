<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>Category</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
  </head>
  <body class="bg-info-subtle">
    <nav class="navbar bg-white shadow-sm py-3">
      <div class="container-fluid">
        <a class="navbar-brand logo fw-bold text-dark" href="#">
          RISE<span class="text-primary">BLOG</span>
        </a>

        <input
          type="text"
          placeholder="Search"
          class="form-control ms-4 w-25 rounded-pill"
        />

        <div class="d-flex align-items-center ms-auto">
          <img
            src="/images/bell.jpg"
            alt="bell"
            class="ms-3"
            style="height: 24px; width: 24px"
          />

          <img
            src="/images/Flag.jpg"
            alt="Flag"
            class="ms-3"
            style="height: 24px; width: 24px"
          />

          <select class="form-select ms-3 rounded-pill">
            <option selected disabled>Language</option>
            <option value="English">English</option>
            <option value="Urdu">Urdu</option>
          </select>
        </div>
      </div>
    </nav>

    <div class="d-flex">
      <div class="bg-white p-3 shadow-sm" style="width: 250px; height: 100vh">
        <button class="btn btn-primary w-100 mb-2">
          <a
            href="/pages/Dashboard.html"
            class="text-white text-decoration-none"
            >DASHBOARD</a
          >
        </button>
        <button class="btn btn-primary w-100">
          <a href="/pages/Title.html" class="text-white text-decoration-none"
            >Add Articles</a
          >
        </button>
        <button class="btn btn-primary w-100 mt-2">
          <a
            href="/pages/Category.html"
            class="text-white tex text-decoration-none"
            >Category</a
          >
        </button>
        <button class="btn btn-primary w-100 mt-2">
          <a
            href="/pages/Subcategory.html"
            class="text-white text-decoration-none"
            >Subcategory</a
          >
        </button>
      </div>

      <div class="flex-grow-1 p-4">
        <div class="d-flex justify-content-between align-items-center m-4 p-4">
          <h5>CATEGORY LIST</h5>
          <button
            type="button"
            class="btn btn-success"
            data-bs-toggle="modal"
            data-bs-target="#exampleModal"
          >
            Add New
          </button>
          <div
            class="modal fade"
            id="exampleModal"
            tabindex="-1"
            aria-labelledby="exampleModalLabel"
            aria-hidden="true"
          >
            <div class="modal-dialog">
              <div class="modal-content">
                <div class="modal-header">
                  <h1 class="modal-title fs-5" id="exampleModalLabel">
                    Category Name
                  </h1>
                  <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close"
                  ></button>
                </div>
                <div class="modal-body">
                  <input type="text" class="form-control" />
                </div>
                <div class="modal-footer">
                  <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal"
                  >
                    Close
                  </button>
                  <button type="button" class="btn btn-primary">
                    Save changes
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="container">
          <table class="table table-bordered">
            <thead>
              <tr>
                <th>ID</th>
                <th>Category</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>1</td>
                <td>Development</td>
                <td><i class="fa-solid fa-pen-to-square"></i></td>
              </tr>
              <tr>
                <td>2</td>
                <td>Food</td>
                <td><i class="fa-solid fa-pen-to-square"></i></td>
              </tr>
              <tr>
                <td>3</td>
                <td>Nutritions</td>
                <td><i class="fa-solid fa-pen-to-square"></i></td>
              </tr>
              <tr>
                <td>4</td>
                <td>Science</td>
                <td><i class="fa-solid fa-pen-to-square"></i></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
